<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自閉症檢核表｜純 GitHub Pages 示範版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;font:16px/1.7 system-ui,"Microsoft JhengHei",sans-serif;color:#223747}header{background:#123e52;color:#fff;padding:20px 5vw}header h1{font-size:1.4rem;margin:0}main{max-width:860px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #dce6eb;border-radius:12px;padding:22px;margin-bottom:18px}.warn{background:#fff6df;border:1px solid #e6ca77;border-radius:10px;padding:13px;margin-bottom:18px}h2{margin:0 0 14px;font-size:1.2rem}button{background:#13767c;border:0;border-radius:8px;color:white;padding:9px 14px;font:inherit;cursor:pointer;margin:4px}button.alt{background:#eff7f7;color:#13666b;border:1px solid #9dbfbe}input,select{font:inherit;padding:8px;border:1px solid #a9b9c5;border-radius:7px;max-width:100%;width:100%;margin:4px 0 14px}label{display:block}.hidden{display:none}.q{border-top:1px solid #dde6eb;padding:10px 0}.answers{display:flex;flex-wrap:wrap;gap:10px}.answers label{border:1px solid #e1e5e9;border-radius:7px;padding:5px 9px;cursor:pointer}.answers input{width:auto;margin-right:4px}.muted{font-size:.9rem;color:#637889}.bad{color:#a43232}.good{color:#087344}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px;text-align:left;font-size:.9rem}@media print{header,.warn,button,.formPanel{display:none!important}main{max-width:none;margin:0}.card{border:0;padding:0}#receipt{display:block!important}@page{size:A4 portrait;margin:14mm}}
</style></head><body>
<header><h1>自閉症兒童行為檢核表：純 GitHub Pages 測試版</h1></header>
<main><div class="warn"><strong>僅供虛構測試。</strong>目前為示範題目，非原始144題；不計分、不供鑑定。GitHub Pages 無後端，不能自動收件、真正驗證管理密碼或安全撤銷連結。連結到期只根據使用者裝置時間提醒。</div>
<section class="card" id="start"><h2>選擇入口</h2><button id="toManager">心評端：建立連結與匯入</button><button class="alt" id="toAnswer">家長／教師示範填答</button><p class="muted">答案只能加密下載後由填答者另外傳回心評人員，不會上傳到 GitHub。</p></section>
<section class="card hidden" id="manager"><h2>心評端（無伺服器帳號）</h2><div class="formPanel">
<label>選擇版本<select id="ver"><option value="preschool">學前（50題）</option><option value="lower">低年級（47題）</option><option value="upper">中年級以上（47題）</option></select></label>
<label>連結有效時間<select id="hours"><option value="24">24小時</option><option value="72" selected>3天</option><option value="168">7天</option></select></label>
<button id="create">產生示範連結</button><div id="linkBox" class="hidden"><label>分享連結<input id="link" readonly></label><button class="alt" id="copy">複製連結</button><button id="previewInvite">試填此連結</button></div>
<hr><h2>匯入加密答案檔</h2><label>選取加密檔<input type="file" id="file" accept=".json,application/json"></label><label>解密密碼<input id="decryptPass" type="password" autocomplete="off"></label><button id="decrypt">解密並查看</button><p id="importMsg" class="bad"></p></div></section>
<section class="card hidden" id="answer"><h2 id="answerTitle">填答示範</h2><p id="deadline" class="muted"></p><p id="progress" class="muted"></p><div id="items"></div><p id="incomplete" class="bad"></p><div class="formPanel"><button id="verify">檢查是否全部填答</button><div id="submitArea" class="hidden"><p>設定至少12字元的密碼，下載加密答案檔；檔案與密碼請分別傳送。</p><input id="encryptPass" type="password" placeholder="加密密碼，至少12字元"><button id="export">加密並下載答案檔</button></div></div><p id="answerMsg" class="good"></p></section>
<section class="card hidden" id="receipt"><h2>填答結果（未計分）</h2><p id="meta"></p><button id="saveCsv">匯出CSV</button><button id="print">A4列印／儲存PDF</button><table><thead><tr><th>題號</th><th>題目</th><th>選項</th></tr></thead><tbody id="result"></tbody></table></section>
</main><script>
"use strict";
const defs={preschool:["學前",50],lower:["低年級",47],upper:["中年級以上",47]},opts=[["always","總是如此"],["often","經常如此"],["sometimes","偶爾如此"],["never","從不如此"]];
const el=id=>document.getElementById(id);let invitation=null,answers=[],result=null,submitted=false;
const demo=i=>"示範題目 "+(i+1)+"（非原始檢核表題幹）";
function view(id){["start","manager","answer","receipt"].forEach(x=>el(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
function inviteFromURL(){let u=new URL(location.href),v=u.searchParams.get("v"),t=Number(u.searchParams.get("expires")),id=u.searchParams.get("id");return Object.prototype.hasOwnProperty.call(defs,v)&&Number.isSafeInteger(t)&&t>0&&/^[a-z0-9-]{8,80}$/i.test(id||"")?{v,t,id}:null}
function render(){let expired=Date.now()>invitation.t;el("deadline").textContent="有效期限（只以裝置時間判斷）："+new Date(invitation.t).toLocaleString("zh-TW")+(expired?"；目前顯示已逾期":"");el("progress").textContent="已答 "+answers.filter(x=>x!==null).length+"／"+answers.length+" 題";let root=el("items");root.replaceChildren();answers.forEach((a,i)=>{let box=document.createElement("div"),txt=document.createElement("div"),grp=document.createElement("div");box.className="q";txt.textContent=(i+1)+". "+demo(i);grp.className="answers";for(let [key,label] of opts){let lab=document.createElement("label"),radio=document.createElement("input");radio.type="radio";radio.name="q"+i;radio.value=key;radio.checked=a===key;radio.disabled=expired||submitted;radio.addEventListener("change",()=>{answers[i]=key;el("progress").textContent="已答 "+answers.filter(x=>x!==null).length+"／"+answers.length+" 題"});lab.append(radio,document.createTextNode(label));grp.append(lab)}box.append(txt,grp);root.append(box)});el("verify").disabled=expired||submitted;el("submitArea").classList.add("hidden")}
function openInvitation(o){invitation=o;answers=Array(defs[o.v][1]).fill(null);submitted=false;el("answerMsg").textContent="";el("incomplete").textContent="";el("answerTitle").textContent=defs[o.v][0]+"檢核表（示範 "+answers.length+" 題）";render();view("answer")}
function newInvite(){let o={v:el("ver").value,t:Date.now()+Number(el("hours").value)*3600000,id:crypto.randomUUID()};let u=new URL(location.href);u.hash="";u.search="";u.searchParams.set("mode","respond");u.searchParams.set("v",o.v);u.searchParams.set("expires",String(o.t));u.searchParams.set("id",o.id);el("link").value=u.href;el("linkBox").classList.remove("hidden")}
function check(){let miss=answers.filter(x=>x===null).length;el("incomplete").textContent=miss?"尚有 "+miss+" 題未答。":"";if(!miss)el("submitArea").classList.remove("hidden")}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyOf(p,s){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function download(name,text,type){let link=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type}));link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function exportFile(){if(submitted||Date.now()>invitation.t||answers.some(a=>a===null))return;let pass=el("encryptPass").value;if(pass.length<12){el("answerMsg").textContent="密碼至少12字元";return}try{let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await keyOf(pass,salt),record={kind:"asd-answer-v1",v:invitation.v,id:invitation.id,submittedAt:new Date().toISOString(),answers};let payload=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(record)));download("asd-answer-"+invitation.id.slice(0,8)+".json",JSON.stringify({kind:"asd-encrypted-v1",salt:b64(salt),iv:b64(iv),data:b64(payload)},null,2),"application/json");submitted=true;el("encryptPass").value="";el("answerMsg").textContent="已下載加密答案檔。請傳送給心評人員並另行提供密碼。";render()}catch(e){el("answerMsg").textContent="加密未成功，請確認以HTTPS開啟。"}}
async function importFile(){el("importMsg").textContent="";let file=el("file").files[0],pass=el("decryptPass").value;if(!file||file.size>500000||!pass){el("importMsg").textContent="請選取答案檔並輸入密碼";return}try{let blob=JSON.parse(await file.text());if(blob.kind!=="asd-encrypted-v1")throw Error();let salt=unb64(blob.salt),iv=unb64(blob.iv);if(salt.length!==16||iv.length!==12)throw Error();let key=await keyOf(pass,salt),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,unb64(blob.data)),record=JSON.parse(new TextDecoder().decode(pt));if(record.kind!=="asd-answer-v1"||!Object.prototype.hasOwnProperty.call(defs,record.v)||!Array.isArray(record.answers)||record.answers.length!==defs[record.v][1]||!record.answers.every(a=>opts.some(o=>o[0]===a)))throw Error();result=record;el("decryptPass").value="";showResult()}catch(e){el("importMsg").textContent="檔案或密碼無法驗證。"}}
function showResult(){view("receipt");el("meta").textContent="版本："+defs[result.v][0]+"；題數："+result.answers.length+"；提交時間："+new Date(result.submittedAt).toLocaleString("zh-TW")+"。未計分。";let root=el("result");root.replaceChildren();result.answers.forEach((a,i)=>{let row=document.createElement("tr");[String(i+1),demo(i),opts.find(o=>o[0]===a)[1]].forEach(x=>{let cell=document.createElement("td");cell.textContent=x;row.append(cell)});root.append(row)})}
el("toManager").onclick=()=>view("manager");el("toAnswer").onclick=()=>openInvitation({v:"preschool",t:Date.now()+86400000,id:crypto.randomUUID()});el("create").onclick=newInvite;el("previewInvite").onclick=()=>{let u=new URL(el("link").value);openInvitation({v:u.searchParams.get("v"),t:Number(u.searchParams.get("expires")),id:u.searchParams.get("id")})};el("copy").onclick=()=>navigator.clipboard.writeText(el("link").value).then(()=>{el("copy").textContent="已複製"});el("verify").onclick=check;el("export").onclick=exportFile;el("decrypt").onclick=importFile;el("print").onclick=()=>print();el("saveCsv").onclick=()=>{if(!result)return;let rows=[["題號","題目","選項"],...result.answers.map((a,i)=>[i+1,demo(i),opts.find(o=>o[0]===a)[1]])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")).join("\r\n");download("asd-answer.csv","\uFEFF"+csv,"text/csv;charset=utf-8")};const link=inviteFromURL();if(new URL(location.href).searchParams.get("mode")==="respond"&&link)openInvitation(link);
</script></body></html>
