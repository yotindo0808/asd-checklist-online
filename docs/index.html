<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自閉症檢核表｜版本資訊</title><style>body{margin:0;background:#f5f7fb;color:#253b55;font:16px/1.75 system-ui,'Microsoft JhengHei',sans-serif}main{max-width:680px;margin:13vh auto;background:white;padding:35px;border:1px solid #d8e1ec;border-radius:16px}a{color:#16558a}small{color:#67758b}</style></head><body><main><h1>自閉症檢核表系統</h1><p>先前的「匯出答案檔再傳回」示範流程已停用，請勿在此上傳或填寫真實學生資料。</p><p>目前採用 <strong>Google Apps Script + 私人 Google 試算表</strong> 的自動收件方案，家長提交後由心評人員在管理端直接取得答案。</p><p>新的正式測試網址須由系統擁有者完成 Google Apps Script 授權與部署後產生。</p><p><a href="https://github.com/yotindo0808/asd-checklist-online">查看最新版部署說明</a></p><small>尚未通過專業計分規則與個資安全驗收，暫不可正式施測。</small></main></body></html>
