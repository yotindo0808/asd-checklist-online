<!doctype html>
<html lang="zh-Hant">
<head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自閉症兒童行為檢核表｜線上填答</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#25354a;background:#f4f7fb;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:#164578;color:white;font-weight:650}button.secondary{background:#e8eef6;color:#204769}button.danger{background:#9c3141}button:disabled{opacity:.5;cursor:wait}input,select{padding:10px;border:1px solid #a9b7c8;border-radius:8px;background:#fff;width:100%;color:#25354a}label{display:block;font-weight:600;font-size:.9rem;margin:8px 0 4px}header{background:#fff;border-bottom:1px solid #dde5ee;padding:15px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:1.14rem;margin:0;color:#173a64}main{max-width:1100px;margin:25px auto;padding:0 18px 45px}.card{background:white;border:1px solid #dce4ed;border-radius:14px;padding:21px;margin-bottom:18px;box-shadow:0 5px 20px #1e3f6010}.muted{color:#5d6c7f;font-size:.9rem}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.hidden{display:none!important}h2{font-size:1.16rem;margin:0 0 10px}h3{font-size:1.02rem;margin:12px 0}.notice{padding:12px 14px;border:1px solid #d6e2ef;background:#f4f8fe;border-radius:10px;color:#304966;margin:10px 0}.warning{background:#fff7ed;border-color:#f5d6a5;color:#8a4c10}.error{color:#a72e3a;font-weight:600;min-height:1.4em}.ok{color:#216344;font-weight:600}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.91rem}th,td{padding:9px;border-bottom:1px solid #e5ebf2;text-align:left;vertical-align:top}th{background:#f5f8fd}td button{padding:6px 9px;font-size:.83rem;margin:2px}.question{padding:15px 0;border-bottom:1px solid #e4eaf2}.question .statement{font-weight:600;margin-bottom:9px}.choicegrid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:9px}.choice{display:flex;align-items:center;gap:6px;background:#f5f8fc;border:1px solid #dce6f2;border-radius:8px;padding:8px 10px;font-size:.92rem;cursor:pointer}.choice input{width:auto;accent-color:#164578}.choice:has(input:checked){border-color:#164578;background:#eaf2fb}.stat{font-weight:650}.divider{border-top:1px solid #e5edf5;margin:18px 0}.linktext{overflow-wrap:anywhere;font-size:.9rem;background:#f1f5f9;padding:10px;border-radius:8px}.onlyprint{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.login{max-width:430px;margin:50px auto}.badge{font-size:.78rem;color:#526a80;background:#e7eef6;border-radius:999px;padding:3px 9px}.steps{font-size:.82rem;color:#4e627a}.small{font-size:.8rem}.topspace{margin-top:16px}@media(max-width:650px){.card{padding:16px}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:13px 18px}.row{align-items:stretch}button{width:auto}}@page{size:A4 portrait;margin:14mm 12mm}@media print{body{background:white;font-size:10pt}header,.noprint,#adminLogin,#adminWork,#respondStart,#respondForm,.notice,.error{display:none!important}main{margin:0;padding:0;max-width:none}.onlyprint{display:block!important}.card{border:0;box-shadow:none;padding:0}table{font-size:9pt;table-layout:fixed}th,td{padding:5px 6px;overflow-wrap:anywhere}tr{break-inside:avoid}h2{margin-bottom:7px}}
</style>
</head>
<body>
<header><h1>自閉症兒童行為檢核表｜線上填答</h1><span id="modeLabel" class="badge">心評端</span></header>
<main>
<div class="notice warning noprint">工程測試版：題幹已取自原始文件並完成程式核對，仍待專業逐字覆核；不提供正式計分或鑑定結論。完成個資及量表使用授權驗收前，請勿輸入真實學生資料。</div>
<div id="globalError" class="error noprint" role="alert"></div>
<section id="adminLogin" class="card login noprint">
<h2>心評人員管理入口</h2><p class="muted">輸入由系統擁有者設定的管理密碼。家長不需登入。</p>
<label for="adminPassword">管理密碼</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="請輸入管理密碼">
<div class="actions"><button onclick="adminLogin()">登入管理端</button></div>
</section>
<section id="adminWork" class="hidden noprint">
<div class="card"><div class="row"><h2 class="grow">建立填答邀請</h2><button class="secondary" onclick="refreshInvites()">重新整理結果</button></div>
<div class="grid"><div><label for="version">量表版本</label><select id="version"><option value="preschool">學前學生用（50題）</option><option value="lower_elementary">低年級學生用（47題）</option><option value="upper_elementary_plus">中年級以上（47題）</option></select></div>
<div><label for="role">填答者身分</label><select id="role"><option value="parent">家長</option><option value="teacher">教師</option><option value="reporter">提報人員</option></select></div>
<div><label for="hours">連結有效時間</label><select id="hours"><option value="24">24 小時</option><option value="72" selected>3 天</option><option value="168">7 天</option><option value="1">1 小時（測試）</option></select></div>
<div><label for="caseLabel">個案代號（不要輸入真實姓名）</label><input id="caseLabel" maxlength="80" placeholder="例如：測試個案 A"></div></div>
<label class="row" style="margin:12px 0"><input id="useCode" type="checkbox" style="width:auto" checked>另設8位填答驗證碼，經不同管道告知填答者</label>
<button onclick="createInvite()">建立專屬填答連結</button><div id="newInvite" class="hidden notice"></div>
</div>
<div class="card"><h2>已建立邀請與填答結果</h2><p class="muted">已提交的資料僅供登入的管理者領取，預設在提交後7天清理。下載並確認儲存成功後，可立即刪除。</p>
<div id="inviteList" class="tablewrap">尚未載入</div></div>
<div id="resultCard" class="card hidden"><div class="row"><h2 class="grow">填答結果（未計分）</h2><button class="secondary" onclick="exportJson()">下載 JSON</button><button class="secondary" onclick="exportCsv()">下載 CSV</button><button onclick="printResult()">列印 A4 PDF</button></div><div id="resultSummary"></div><div class="tablewrap" id="resultTable"></div></div>
</section>
<section id="respondStart" class="card hidden noprint"><h2>填答者入口</h2><p class="muted">請依學生最近半年的行為表現作答。每題只能選擇一項，填答者無須計分。</p><label for="inviteCode">填答驗證碼（若心評人員有提供）</label><input id="inviteCode" placeholder="8位驗證碼，可留空" maxlength="12" autocomplete="off"><div class="actions"><button onclick="startRespond()">開始填答</button></div></section>
<section id="respondForm" class="hidden noprint"><div class="card"><div class="row"><div class="grow"><h2 id="formTitle"></h2><span id="formMeta" class="muted"></span></div><span id="progress" class="badge"></span></div><div id="questions"></div><div class="actions"><button class="secondary" onclick="prevPage()">上一頁</button><button class="secondary" onclick="nextPage()">下一頁</button><button class="secondary" onclick="saveDraft()">儲存草稿</button><button onclick="submitAnswers()">檢查並正式提交</button></div><p class="muted" id="respondMessage"></p></div></section>
<section id="submitSuccess" class="card hidden noprint"><h2>已完成提交</h2><p class="ok">問卷已傳送至心評人員管理端，不需要下載檔案或另外傳送答案。</p></section>
<section id="printArea" class="onlyprint"></section>
</main>
<script>var INITIAL_INVITE = <?!= JSON.stringify(initialInvite) ?>;</script>
<script>
'use strict';
const CHOICES=[['always','總是如此'],['often','經常如此'],['sometimes','偶爾如此'],['never','從不如此']];
const ROLES={parent:'家長',teacher:'教師',reporter:'提報人員'};
let adminToken='',invitationToken=INITIAL_INVITE,inviteCode='',bank=null,answers={},page=0,currentResult=null;
const el=id=>document.getElementById(id);
function show(id,on){el(id).classList.toggle('hidden',!on)}
function msg(s){el('globalError').textContent=s||''}
function callServer(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));runner[name](...args)})}
async function process(action){msg('');try{await action()}catch(e){msg(e.message||String(e))}}
function safeText(s){return String(s==null?'':s)}
function appendCell(row,value,tag){const t=document.createElement(tag||'td');t.textContent=safeText(value);row.appendChild(t);return t}
function button(text,fn,kind){const b=document.createElement('button');b.textContent=text;b.className=kind||'';b.onclick=fn;return b}
function adminLogin(){process(async()=>{const password=el('adminPassword').value;const r=await callServer('apiLogin',password);el('adminPassword').value='';adminToken=r.token;show('adminLogin',false);show('adminWork',true);await refreshInvites()})}
function createInvite(){process(async()=>{const v={version:el('version').value,respondentRole:el('role').value,caseLabel:el('caseLabel').value,hours:Number(el('hours').value),useCode:el('useCode').checked};const r=await callServer('apiCreateInvite',adminToken,v);const box=el('newInvite');box.textContent='';show('newInvite',true);const strong=document.createElement('strong');strong.textContent='填答連結已建立（僅建立時顯示驗證碼）';box.appendChild(strong);const p=document.createElement('p');p.className='linktext';p.textContent=r.url;box.appendChild(p);box.appendChild(button('複製填答網址',()=>copyText(r.url),'secondary'));if(r.code){const p2=document.createElement('p');p2.textContent='額外驗證碼：'+r.code+'（請使用不同管道通知填答者）';box.appendChild(p2);box.appendChild(button('複製驗證碼',()=>copyText(r.code),'secondary'));}const p3=document.createElement('p');p3.textContent='截止時間：'+formatDate(r.expiresAt);box.appendChild(p3);await refreshInvites()})}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).catch(()=>window.prompt('請複製文字',s))}else window.prompt('請複製文字',s)}
function formatDate(s){if(!s)return '';const d=new Date(s);return isNaN(d.getTime())?s:d.toLocaleString('zh-TW',{hour12:false})}
async function refreshInvites(){return process(async()=>{const rows=await callServer('apiListInvites',adminToken);const target=el('inviteList');target.textContent='';if(!rows.length){target.textContent='目前沒有邀請或待領取紀錄';return;}const table=document.createElement('table');const thead=document.createElement('thead'),tr=document.createElement('tr');['代號','版本','填答者','狀態','有效截止','操作'].forEach(s=>appendCell(tr,s,'th'));thead.appendChild(tr);table.appendChild(thead);const body=document.createElement('tbody');rows.forEach(r=>{const row=document.createElement('tr');appendCell(row,r.caseLabel||'（未命名）');appendCell(row,({preschool:'學前',lower_elementary:'低年級',upper_elementary_plus:'中年級以上'})[r.version]);appendCell(row,ROLES[r.respondentRole]||r.respondentRole);appendCell(row,({open:'待填答',submitted:'已提交',revoked:'已撤銷',expired:'已到期'})[r.status]||r.status);appendCell(row,formatDate(r.expiresAt));const td=document.createElement('td');if(r.status==='submitted')td.appendChild(button('查看結果',()=>loadResult(r.id)));if(r.status==='open')td.appendChild(button('撤銷連結',()=>revoke(r.id),'secondary'));td.appendChild(button('刪除',()=>removeInvite(r.id),'danger'));row.appendChild(td);body.appendChild(row)});table.appendChild(body);target.appendChild(table)})}
function revoke(id){if(!confirm('確定提前撤銷此邀請？'))return;process(async()=>{await callServer('apiRevokeInvite',adminToken,id);await refreshInvites()})}
function removeInvite(id){if(!confirm('確定要刪除這筆資料？刪除後無法從系統還原，請先確認下載成功。'))return;process(async()=>{await callServer('apiDeleteInvite',adminToken,id);if(currentResult?.id===id){currentResult=null;show('resultCard',false)}await refreshInvites()})}
function loadResult(id){process(async()=>{currentResult=await callServer('apiGetResult',adminToken,id);show('resultCard',true);el('resultSummary').textContent='個案代號：'+(currentResult.caseLabel||'（無）')+'；版本：'+currentResult.title+'；填答者：'+ROLES[currentResult.respondentRole]+'；提交時間：'+formatDate(currentResult.submittedAt)+'。正式計分未啟用。';const target=el('resultTable');target.textContent='';target.appendChild(buildResultTable(currentResult));el('resultCard').scrollIntoView({behavior:'smooth'})})}
function buildResultTable(result){const table=document.createElement('table');const thead=document.createElement('thead');let tr=document.createElement('tr');['題號','題目','作答'].forEach(x=>appendCell(tr,x,'th'));thead.appendChild(tr);table.appendChild(thead);const tbody=document.createElement('tbody');result.items.forEach((q,i)=>{const tr=document.createElement('tr');appendCell(tr,q.number||i+1);appendCell(tr,q.text);appendCell(tr,CHOICES.find(x=>x[0]===result.answers[String(q.number||i+1)])?.[1]||'未答');tbody.appendChild(tr)});table.appendChild(tbody);return table}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportJson(){if(!currentResult)return;downloadFile('ASD-填答結果-'+currentResult.id+'.json',JSON.stringify(currentResult,null,2),'application/json;charset=utf-8')}
function csvCell(s){let v=safeText(s);if(/^[\s]*[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){if(!currentResult)return;const r=currentResult,rows=[['題號','題目','作答']].concat(r.items.map((q,i)=>[q.number||i+1,q.text,CHOICES.find(x=>x[0]===r.answers[String(q.number||i+1)])?.[1]||'未答']));downloadFile('ASD-填答結果-'+r.id+'.csv','\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function printResult(){if(!currentResult)return;const target=el('printArea');target.textContent='';const h=document.createElement('h2');h.textContent='自閉症兒童行為檢核表（答題紀錄，未計分）';target.appendChild(h);const p=document.createElement('p');p.textContent='版本：'+currentResult.title+'；個案代號：'+(currentResult.caseLabel||'（無）')+'；提交時間：'+formatDate(currentResult.submittedAt);target.appendChild(p);target.appendChild(buildResultTable(currentResult));const note=document.createElement('p');note.textContent='本表僅呈現逐題作答，不提供分數及鑑定結論。';target.appendChild(note);window.print()}
function startRespond(){process(async()=>{inviteCode=el('inviteCode').value.trim().toUpperCase();bank=await callServer('apiOpenInvite',invitationToken,inviteCode);answers=bank.answers||{};page=0;el('modeLabel').textContent='填答端';show('respondStart',false);show('respondForm',true);el('formTitle').textContent=bank.title;el('formMeta').textContent='連結有效至：'+formatDate(bank.expiresAt);renderQuestions()})}
function renderQuestions(){if(!bank)return;const total=bank.items.length;const target=el('questions');target.textContent='';bank.items.slice(page*10,page*10+10).forEach(q=>{const div=document.createElement('div');div.className='question';const statement=document.createElement('div');statement.className='statement';statement.textContent='第 '+q.number+' 題　'+q.text;div.appendChild(statement);const opts=document.createElement('div');opts.className='choicegrid';CHOICES.forEach(([value,label])=>{const item=document.createElement('label');item.className='choice';const input=document.createElement('input');input.type='radio';input.name='q'+q.number;input.value=value;input.checked=answers[String(q.number)]===value;input.onchange=()=>{answers[String(q.number)]=value;updateProgress()};item.appendChild(input);item.appendChild(document.createTextNode(label));opts.appendChild(item)});div.appendChild(opts);target.appendChild(div)});updateProgress();el('respondMessage').textContent='目前第 '+(page+1)+'／'+Math.ceil(total/10)+' 頁。可以隨時按「儲存草稿」。'}
function updateProgress(){el('progress').textContent='已答 '+Object.keys(answers).length+'／'+bank.items.length+' 題'}
function nextPage(){if(page<Math.ceil(bank.items.length/10)-1){page++;renderQuestions();window.scrollTo(0,0)}}
function prevPage(){if(page>0){page--;renderQuestions();window.scrollTo(0,0)}}
function saveDraft(){process(async()=>{await callServer('apiSaveDraft',invitationToken,inviteCode,answers);el('respondMessage').textContent='草稿已儲存至管理端暫存空間'})}
function submitAnswers(){const missing=bank.items.map(q=>String(q.number)).filter(k=>!answers[k]);if(missing.length){msg('尚有 '+missing.length+' 題未作答：'+missing.join('、'));return}if(!confirm('確認正式提交？提交後連結立即失效，不可再次修改。'))return;process(async()=>{await callServer('apiSubmit',invitationToken,inviteCode,answers);show('respondForm',false);show('submitSuccess',true)})}
window.addEventListener('DOMContentLoaded',()=>{if(invitationToken){show('adminLogin',false);show('respondStart',true);el('modeLabel').textContent='填答端'}else{show('adminLogin',true);show('respondStart',false)}el('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()})});
</script>
</body></html>
